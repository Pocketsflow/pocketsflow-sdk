# Mirrors npm onto GitHub: a v<version> tag, a GitHub release and a
# GitHub Packages copy (@pocketsflow/pocketsflow) for every `pocketsflow`
# version on npm. npm publishes are manual (PUBLISHING.md), so this runs on
# every push to main, every 6 hours, and on demand. See scripts/sync-releases.mjs.
name: Sync npm releases

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/sync-releases.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
