# Mirrors npm onto GitHub: a v<version> tag, a GitHub release and a
# GitHub Packages copy (@pocketsflow/pocketsflow) for every `pocketsflow`
# version on npm. It runs right after "Publish to npm" succeeds, on every push
# to main, every 6 hours, and on demand. See scripts/sync-releases.mjs.
name: Sync npm releases

on:
  workflow_run:
    workflows: [Publish to npm]
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      refresh_notes:
        description: 'Versions whose existing release notes to rewrite from CHANGELOG.md, e.g. "3.7.0" (optional)'
        required: false
        default: ''

permissions:
  contents: write
  packages: write

concurrency:
  group: sync-releases
  cancel-in-progress: false

jobs:
  sync:
    # After a publish run, only when it succeeded.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-releases.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFRESH_NOTES: ${{ inputs.refresh_notes }}
