# Publishes `pocketsflow` to npm when main carries a version npm doesn't have
# yet. Bump `version` in package.json and add its `## <version>` section to
# CHANGELOG.md in the release PR; merging it to main publishes. Versions npm
# already has are skipped, so every other push to main is a no-op.
#
# Needs the repository secret NPM_TOKEN: a granular npm access token with
# read and write access to the `pocketsflow` package ("Bypass 2FA" on).
#
# When it succeeds, "Sync npm releases" runs (workflow_run) and mirrors the
# new version onto GitHub: v<version> tag, GitHub release, GitHub Packages.
name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Is this version already on npm?
        id: version
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm: nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on npm yet: publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: CHANGELOG has this version's section
        if: steps.version.outputs.publish == 'true'
        run: |
          grep -q "^## ${{ steps.version.outputs.version }}$" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no '## ${{ steps.version.outputs.version }}' section (it becomes the GitHub release notes)."
            exit 1
          }

      - name: NPM_TOKEN is set
        if: steps.version.outputs.publish == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ -n "$NPM_TOKEN" ] || {
            echo "::error::The NPM_TOKEN repository secret is missing (Settings > Secrets and variables > Actions)."
            exit 1
          }

      - if: steps.version.outputs.publish == 'true'
        run: npm ci

      - if: steps.version.outputs.publish == 'true'
        run: npm run lint

      - if: steps.version.outputs.publish == 'true'
        run: npm run typecheck

      - if: steps.version.outputs.publish == 'true'
        run: npm test

      - name: npm publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
